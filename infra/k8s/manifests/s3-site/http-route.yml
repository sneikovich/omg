apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: static-site
  namespace: envoy-gw
spec:
  parentRefs:
    - name: main-gateway
  hostnames:
    - ${domain_name}
  rules:
    - filters:
        - type: URLRewrite
          urlRewrite:
            hostname: ${bucket_website_hostname}
      backendRefs:
        - group: gateway.envoyproxy.io
          kind: Backend
          name: static-site
          port: 80

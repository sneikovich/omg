apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: osm-app
  namespace: osm-app
spec:
  parentRefs:
    - name: main-gateway
      namespace: envoy-gw
  hostnames:
    - ${domain_name}
  rules:
    # /api напряму на k8s Service фетчера (native backendRef, без Backend CRD -
    # він потрібен лише для цілей поза кластером, як S3 нижче). Специфічність
    # матчу важливіша за порядок правил у списку - Envoy Gateway сам сортує
    # /api вище за /, але лишаємо явний порядок для читабельності.
    - matches:
        - path:
            type: PathPrefix
            value: /api
      backendRefs:
        - name: fetcher
          port: 8080
    - matches:
        - path:
            type: PathPrefix
            value: /
      filters:
        - type: URLRewrite
          urlRewrite:
            hostname: ${bucket_website_hostname}
      backendRefs:
        - group: gateway.envoyproxy.io
          kind: Backend
          name: frontend-site
          port: 80
